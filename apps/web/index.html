<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Ticket links are credentials: keep every page out of search engines
         and never send the URL to another site as a referrer. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <!-- The app ships its own palette; opt out of browser "auto dark" recolouring,
         which would otherwise darken the white tile behind the ticket's QR code.
         (Backed up in index.css; the ticket's QR is additionally drawn on a canvas.) -->
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#0D1524" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skener" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Propusnica</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
