# Netlify hosts the web app and proxies /api and /uploads to the API (Railway).
# The proxy keeps everything on ONE origin for the browser, which is what makes
# the HTTP-only SameSite auth cookies work. Set API_URL in the Netlify
# environment variables (e.g. https://your-api.up.railway.app); the build
# writes the proxy rules from it (scripts/netlify-redirects.mjs).

[build]
  command = "npm run build:web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# Ticket pages are credentials: never cache them.
[[headers]]
  for = "/t/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
